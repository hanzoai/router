[package]
name = "hanzo-router"
version = "0.1.1"
edition = "2021"
description = "Memory- and engine-aware model router — the native companion to hanzo-ml/hanzo-engine that hanzo-node uses to route requests across local + cloud models."
repository = "https://github.com/hanzoai/router"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# `proxy` front (replica load-balancing HTTP server): the async/HTTP stack is
# pulled only when the feature is on, so the pure router core stays light.
axum = { version = "0.8.8", optional = true }
tokio = { version = "1.49", features = ["full", "rt-multi-thread"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "stream", "json"], optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[features]
proxy = [
    "dep:axum",
    "dep:tokio",
    "dep:reqwest",
    "dep:futures",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:clap",
    "dep:anyhow",
]

[[bin]]
name = "hanzo-router"
path = "src/bin/proxy.rs"
required-features = ["proxy"]

[dev-dependencies]

# Standalone repo: never inherit a parent workspace.
[workspace]
