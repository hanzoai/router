[package]
name = "router-retrain"
version = "0.1.0"
edition = "2021"
description = "Nightly router-heads retrain: transform the ai routing ledger into enso fit input, ridge-fit heads, holdout-gate, persist heads-{scope}.safetensors."
repository = "https://github.com/hanzoai/engine"
license = "MIT OR Apache-2.0"

[[bin]]
name = "router-fit"
path = "src/main.rs"

[dependencies]
router-learner = { path = "../learner" }
hanzo-router = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.7"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
